<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Growthmodo Instinct — your media-buying instincts, inside Claude">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#304BFF"/>
      <stop offset="0.55" stop-color="#2E42E6"/>
      <stop offset="1" stop-color="#1F2DB8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#7C8CFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7C8CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#FFFFFF" fill-opacity=".14"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="1280" height="440" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="1280" height="440" fill="url(#bg)"/>
    <rect width="1280" height="440" fill="url(#orb)"/>
    <rect width="1280" height="440" fill="url(#dots)"/>

    <!-- Left: wordmark -->
    <g transform="translate(72 92)">
      <rect width="46" height="46" rx="12" fill="#FFFFFF"/>
      <path d="M12 30 L20 21 L26 26 L35 14" fill="none" stroke="#304BFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="62" y="21" fill="#FFFFFF" fill-opacity=".8" font-size="15" font-weight="700" letter-spacing="3">GROWTHMODO</text>
      <text x="62" y="43" fill="#FFFFFF" font-size="24" font-weight="800" letter-spacing=".5">Instinct</text>
    </g>
    <text x="72" y="222" fill="#FFFFFF" font-size="54" font-weight="800" letter-spacing="-1">Your media-buying</text>
    <text x="72" y="284" fill="#FFFFFF" font-size="54" font-weight="800" letter-spacing="-1">instincts, inside Claude.</text>
    <text x="74" y="330" fill="#FFFFFF" fill-opacity=".82" font-size="20">Reports, audits, CPA diagnosis, briefs and compliance for Meta ads —</text>
    <text x="74" y="358" fill="#FFFFFF" fill-opacity=".82" font-size="20">built on Growthmodo's playbooks. Type /instinct and go.</text>

    <!-- Right: floating chat + mini report -->
    <g transform="translate(812 64)">
      <rect width="400" height="312" rx="20" fill="#FFFFFF" fill-opacity=".1" stroke="#FFFFFF" stroke-opacity=".25"/>
      <rect x="18" y="18" width="262" height="38" rx="12" fill="#FFFFFF"/>
      <text x="34" y="43" fill="#1F2DB8" font-size="15" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, monospace">/instinct:cpa</text>
      <text x="178" y="43" fill="#5b6573" font-size="14">why +31%?</text>

      <rect x="18" y="72" width="364" height="222" rx="14" fill="#FFFFFF"/>
      <text x="36" y="100" fill="#304BFF" font-size="12" font-weight="800" letter-spacing="1.5">GROWTHMODO INSTINCT · CPA DIAGNOSIS</text>
      <text x="36" y="128" fill="#121820" font-size="17" font-weight="700">£22.40 → £29.10 · creative fatigue</text>
      <g transform="translate(36 146)">
        <rect width="96" height="46" rx="8" fill="#EEF1FF"/>
        <text x="10" y="18" fill="#5b6573" font-size="11">At stake / wk</text>
        <text x="10" y="37" fill="#B4362B" font-size="17" font-weight="800">£2,480</text>
        <rect x="106" width="96" height="46" rx="8" fill="#EEF1FF"/>
        <text x="116" y="18" fill="#5b6573" font-size="11">CTR</text>
        <text x="116" y="37" fill="#121820" font-size="17" font-weight="800">−27%</text>
        <rect x="212" width="116" height="46" rx="8" fill="#EEF1FF"/>
        <text x="222" y="18" fill="#5b6573" font-size="11">Confidence</text>
        <text x="222" y="37" fill="#17804A" font-size="17" font-weight="800">High</text>
      </g>
      <g transform="translate(36 206)">
        <path d="M0 64 L36 58 L72 62 L108 44 L144 40 L180 26 L216 30 L252 12 L328 4" fill="none" stroke="#304BFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M0 64 L36 58 L72 62 L108 44 L144 40 L180 26 L216 30 L252 12 L328 4 L328 72 L0 72 Z" fill="#304BFF" fill-opacity=".1"/>
        <line x1="0" x2="328" y1="50" y2="50" stroke="#5b6573" stroke-dasharray="5 5" stroke-opacity=".6"/>
        <circle cx="252" cy="12" r="5" fill="#B4362B"/>
      </g>
    </g>
    <rect width="1280" height="160" fill="url(#glow)" opacity=".25"/>
  </g>
</svg>
