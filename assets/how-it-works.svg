<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-label="How it works: you ask in Claude, Instinct loads the Growthmodo playbook, Claude reads your Meta account read-only, you get a branded report or deck">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#304BFF"/><stop offset=".55" stop-color="#2E42E6"/><stop offset="1" stop-color="#1F2DB8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2E42E6"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="1" y="1" width="1278" height="328" rx="24" fill="#FFFFFF" stroke="#E1E5EA"/>
    <text x="48" y="62" fill="#304BFF" font-size="14" font-weight="800" letter-spacing="2.5">HOW IT WORKS</text>

    <!-- step cards -->
    <g transform="translate(48 96)">
      <rect width="262" height="186" rx="18" fill="#F5F7FF" stroke="#DCE2FF"/>
      <circle cx="34" cy="38" r="18" fill="url(#g)"/><text x="34" y="44" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">1</text>
      <text x="24" y="92" fill="#121820" font-size="20" font-weight="800">You ask</text>
      <text x="24" y="120" fill="#5B6573" font-size="15">in plain words, or with</text>
      <text x="24" y="142" fill="#5B6573" font-size="15">a slash command</text>
      <rect x="24" y="152" width="150" height="24" rx="6" fill="#FFFFFF" stroke="#DCE2FF"/>
      <text x="34" y="169" fill="#1F2DB8" font-size="13" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, monospace">/instinct:report</text>
    </g>
    <line x1="318" y1="189" x2="350" y2="189" stroke="#2E42E6" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(358 96)">
      <rect width="262" height="186" rx="18" fill="url(#g)"/>
      <circle cx="34" cy="38" r="18" fill="#FFFFFF"/><text x="34" y="44" text-anchor="middle" fill="#304BFF" font-size="16" font-weight="800">2</text>
      <text x="24" y="92" fill="#FFFFFF" font-size="20" font-weight="800">Instinct loads</text>
      <text x="24" y="116" fill="#FFFFFF" font-size="20" font-weight="800">the playbook</text>
      <text x="24" y="146" fill="#FFFFFF" fill-opacity=".85" font-size="15">Growthmodo's method,</text>
      <text x="24" y="168" fill="#FFFFFF" fill-opacity=".85" font-size="15">thresholds and templates</text>
    </g>
    <line x1="628" y1="189" x2="660" y2="189" stroke="#2E42E6" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(668 96)">
      <rect width="262" height="186" rx="18" fill="#F5F7FF" stroke="#DCE2FF"/>
      <circle cx="34" cy="38" r="18" fill="url(#g)"/><text x="34" y="44" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">3</text>
      <text x="24" y="92" fill="#121820" font-size="20" font-weight="800">Claude reads</text>
      <text x="24" y="116" fill="#121820" font-size="20" font-weight="800">your account</text>
      <text x="24" y="146" fill="#5B6573" font-size="15">via your Meta connector,</text>
      <text x="24" y="168" fill="#5B6573" font-size="15">read-only — never edits</text>
    </g>
    <line x1="938" y1="189" x2="970" y2="189" stroke="#2E42E6" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(978 96)">
      <rect width="254" height="186" rx="18" fill="#F5F7FF" stroke="#DCE2FF"/>
      <circle cx="34" cy="38" r="18" fill="url(#g)"/><text x="34" y="44" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">4</text>
      <text x="24" y="92" fill="#121820" font-size="20" font-weight="800">You get the</text>
      <text x="24" y="116" fill="#121820" font-size="20" font-weight="800">deliverable</text>
      <text x="24" y="146" fill="#5B6573" font-size="15">branded report, graded</text>
      <text x="24" y="168" fill="#5B6573" font-size="15">deck, brief or one fix</text>
    </g>
  </g>
</svg>
